<h1>content-report 개인정보처리방침</h1>
<p>content-report는 그로스마케팅팀 내부용 콘텐츠 성과 수집 도구입니다.</p>
<ul>
<li>사용 권한: 지정된 Google 스프레드시트 읽기·쓰기, 이 앱이 만든 Google Drive 파일(캡쳐 이미지) 관리</li>
<li>수집 정보: 공개된 게시물의 조회수·좋아요·댓글 등 성과 지표와 화면 캡쳐</li>
<li>사용자의 개인정보를 수집하거나 제3자에게 제공하지 않습니다.</li>
</ul>
